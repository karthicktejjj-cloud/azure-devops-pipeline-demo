name: Student Result Portal CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Project Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f README.md
          echo "All required files are present."

      - name: Build Application
        run: |
          mkdir build
          cp index.html build/
          cp style.css build/
          cp script.js build/
          echo "Student Result Portal build completed successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4